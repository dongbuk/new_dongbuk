[build]
  publish = "."
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "24"
[functions]
  node_bundler = "esbuild"
[[redirects]]
  from = "/api/presence"
  to = "/.netlify/functions/presence"
  status = 200
  force = true
[[redirects]]
  from = "/api/game"
  to = "/.netlify/functions/game"
  status = 200
  force = true
[[redirects]]
  from = "/"
  to = "/dongbuk_schoolworld_v02.html"
  status = 200
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
